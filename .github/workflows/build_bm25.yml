name: Build BM25 Index

on:
  workflow_dispatch:

jobs:
  build-bm25:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (includes data/ markdown files)
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build BM25 index
        run: python -u build_bm25.py

      - name: Upload bm25_index as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bm25-index
          path: bm25_index/
          retention-days: 7
